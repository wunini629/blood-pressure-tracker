<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a8dff">
<title>生活记录</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --primary: #4a8dff;
    --primary-deep: #2f6fe4;
    --primary-light: #e8f0fe;
    --bg: #f2f6fc;
    --card: #ffffff;
    --text: #2b3440;
    --text-2: #6b7684;
    --text-3: #9aa4b0;
    --border: #e4eaf2;
    --danger: #f0564f;
    --ok: #3fbb7a;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  body { background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  input, select { font: inherit; }

  /* ===== 登录页 ===== */
  #loginView { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 12px; }
  #loginView .logo { width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(135deg, var(--primary), var(--primary-deep)); display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 8px 20px rgba(74,141,255,.4); }
  #loginView h1 { font-size: 20px; margin-bottom: 12px; }
  #loginView .sub { color: var(--text-2); font-size: 13px; margin-top: -8px; margin-bottom: 8px; }
  #loginView .field { width: 100%; max-width: 320px; }
  #loginView input[type=text], #loginView input[type=password] {
    width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 13px 18px; font-size: 14px; outline: none; color: var(--text);
  }
  #loginView input:focus { border-color: var(--primary); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); max-width: 320px; width: 100%; padding-left: 8px; }
  .check-row input { accent-color: var(--primary); width: 16px; height: 16px; }

  .btn { background: linear-gradient(135deg, var(--primary), var(--primary-deep)); color: #fff; border-radius: 999px; padding: 13px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 12px rgba(74,141,255,.35); width: 100%; }
  .btn:active { opacity: .85; }
  .btn.plain { background: var(--primary-light); color: var(--primary-deep); box-shadow: none; }
  #loginView .btn { max-width: 320px; }

  /* ===== 主框架 ===== */
  #appView { display: none; }
  .sidebar { display: none; }
  .page { display: none; padding: 16px 16px 96px; max-width: 640px; margin: 0 auto; }
  .page.on { display: block; }
  .page h2 { font-size: 17px; padding: 4px 4px 14px; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(58px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 20; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-3); gap: 3px; }
  .tabbar button.on { color: var(--primary); font-weight: 600; }
  .tabbar .ico { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .45; }
  .tabbar button.on .ico { filter: none; opacity: 1; }

  /* ===== 通用组件 ===== */
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 3px 12px rgba(70,100,140,.07); }
  .seg { display: flex; background: #e6edf7; border-radius: 999px; padding: 3px; }
  .seg button { flex: 1; text-align: center; padding: 9px; font-size: 13px; border-radius: 999px; color: var(--text-2); }
  .seg button.on { background: #fff; color: var(--primary-deep); font-weight: 700; box-shadow: 0 2px 6px rgba(70,100,140,.12); }

  /* ===== 录入页 ===== */
  .add-form { display: flex; flex-direction: column; gap: 12px; }
  .bp-row { display: flex; gap: 10px; }
  .bp-field { flex: 1; background: var(--bg); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .bp-field input { width: 100%; border: none; background: none; text-align: center; font-size: 24px; font-weight: 800; color: var(--text); outline: none; }
  .bp-field input.bad { color: var(--danger); }
  .bp-field .k { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); background: #fff; border-radius: 999px; padding: 6px 8px 6px 16px; box-shadow: 0 3px 12px rgba(70,100,140,.07); }
  .meta-row input { border: none; outline: none; color: var(--text); font-size: 13px; background: none; }
  .note-input { width: 100%; border: 1px solid var(--border); border-radius: 999px; padding: 12px 18px; font-size: 13px; outline: none; background: #fff; color: var(--text); }
  .note-input:focus { border-color: var(--primary); }

  .cam-fab { position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); right: 18px; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cam-fab .circle { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-deep)); display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 6px 18px rgba(74,141,255,.45); border: 3px solid #fff; }
  .cam-fab .circle.busy { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .cam-fab .cap { font-size: 10px; color: var(--text-2); background: rgba(255,255,255,.9); border-radius: 999px; padding: 2px 8px; }

  /* ===== 记录列表 ===== */
  .rec-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .rec { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: var(--radius); padding: 13px 14px; box-shadow: 0 3px 12px rgba(70,100,140,.07); }
  .rec .nums { flex: 1; min-width: 0; }
  .rec .bp { font-size: 17px; font-weight: 800; }
  .rec .bp.bad { color: var(--danger); }
  .rec .bp small { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 8px; }
  .rec .t { font-size: 11px; color: var(--text-3); margin-top: 3px; }
  .rec .note { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .pill { font-size: 10px; border-radius: 999px; padding: 4px 10px; font-weight: 600; white-space: nowrap; }
  .pill.before { background: var(--primary-light); color: var(--primary-deep); }
  .pill.after { background: #e5f7ee; color: var(--ok); }
  .rec .del { color: var(--text-3); font-size: 15px; padding: 6px; }
  .rec .del:active { color: var(--danger); }
  .empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 40px 0; }

  /* ===== 图表 ===== */
  .chart-card canvas { width: 100%; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .range-row { display: flex; gap: 8px; margin-top: 12px; }
  .range-row button { flex: 1; font-size: 11px; padding: 7px; border-radius: 999px; background: #e6edf7; color: var(--text-2); }
  .range-row button.on { background: var(--primary); color: #fff; font-weight: 600; }

  /* ===== 设置页 ===== */
  .set-group { margin-bottom: 16px; }
  .set-group h3 { font-size: 13px; color: var(--text-2); margin-bottom: 8px; padding-left: 4px; }
  .set-group .card { display: flex; flex-direction: column; gap: 10px; }
  .set-row { display: flex; flex-direction: column; gap: 4px; }
  .set-row label { font-size: 12px; color: var(--text-3); }
  .set-row input { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; outline: none; color: var(--text); }
  .set-row input:focus { border-color: var(--primary); }

  /* ===== 体重 ===== */
  .weight-card { text-align: center; position: relative; padding: 20px 14px 16px; }
  .weight-card .wv-wrap { display: flex; align-items: baseline; justify-content: center; }
  .weight-card input { width: 150px; border: none; background: none; text-align: right; font-size: 40px; font-weight: 800; color: var(--text); outline: none; }
  .weight-card .wu { font-size: 14px; color: var(--text-3); margin-left: 4px; }
  .unit-toggle { position: absolute; top: 12px; right: 12px; font-size: 11px; background: var(--primary-light); color: var(--primary-deep); border-radius: 999px; padding: 5px 10px; font-weight: 600; }
  .hint { display: inline-block; font-size: 11px; border-radius: 999px; padding: 4px 12px; margin-top: 8px; font-weight: 600; }
  .hint.down { background: #e5f7ee; color: var(--ok); }
  .hint.up { background: #fdeeed; color: var(--danger); }
  .pill.fasting { background: #fdf3e3; color: #c07f1a; }
  .pill.full { background: #ece9fd; color: #6b54d3; }
  .bmi-card { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: var(--radius); padding: 12px 16px; box-shadow: 0 3px 12px rgba(70,100,140,.07); font-size: 13px; margin-bottom: 12px; }
  .bmi-card .b { font-size: 19px; font-weight: 800; color: var(--primary-deep); }
  .bmi-card .s { font-size: 11px; border-radius: 999px; padding: 3px 10px; font-weight: 600; }
  .bmi-card .s.ok { color: var(--ok); background: #e5f7ee; }
  .bmi-card .s.warn { color: #c07f1a; background: #fdf3e3; }
  /* 体重统计卡 */
  .stat-card { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 3px 12px rgba(70,100,140,.07); display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .stat-main { font-size: 19px; font-weight: 800; }
  .stat-main .g { color: var(--ok); }
  .stat-main .r { color: var(--danger); }
  .stat-sub { font-size: 11px; color: var(--text-3); }
  /* 体重·行式列表（表头吸顶，故容器不用 overflow:hidden） */
  .wtab { background: #fff; border-radius: var(--radius); box-shadow: 0 3px 12px rgba(70,100,140,.07); }
  .wrow { display: flex; align-items: center; padding: 6px 14px; font-size: 13px; }
  .wrow + .wrow { border-top: 1px solid var(--border); }
  .wrow.head { font-size: 11px; color: var(--text-3); padding: 7px 14px; background: #e6edf7; border-radius: var(--radius) var(--radius) 0 0; position: sticky; top: 0; z-index: 2; }
  .wrow:last-child { border-radius: 0 0 var(--radius) var(--radius); }
  .wrow .c-date { flex: 1.1; font-weight: 600; }
  .wrow .c-date small { display: block; font-weight: 400; font-size: 10px; color: var(--text-3); }
  .wrow .c-w { flex: 1; font-weight: 700; line-height: 1.2; }
  .wrow .c-w small { display: block; font-weight: 400; color: var(--text-3); font-size: 9px; }
  .wrow .c-w.none { color: var(--text-3); font-weight: 400; }
  .wrow .c-df { flex: .8; text-align: right; font-weight: 700; font-size: 12px; }
  .wrow .c-df small { display: block; font-weight: 400; font-size: 9px; opacity: .85; }
  .wrow .c-df.down { color: var(--ok); }
  .wrow .c-df.up { color: var(--danger); }
  .wrow .c-df.flat { color: var(--text-3); font-weight: 400; }
  /* 阶段目标卡 */
  .stage-card { background: linear-gradient(135deg, #eaf3ff, #f3efff); border-radius: var(--radius); padding: 12px 14px; box-shadow: 0 3px 12px rgba(70,100,140,.07); margin-bottom: 10px; }
  .stage-now { font-size: 12px; color: var(--text-2); }
  .stage-big { font-size: 22px; font-weight: 800; color: var(--primary-deep); margin-top: 2px; }
  .stage-big small { font-size: 11px; font-weight: 600; color: var(--text-2); }
  .stage-bar { height: 8px; border-radius: 999px; background: #fff; margin-top: 8px; overflow: hidden; }
  .stage-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #6b54d3); }
  .stage-done { font-size: 11px; color: var(--text-3); margin-top: 8px; }
  .stage-row { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--bg); border-radius: 999px; padding: 6px 8px 6px 14px; }
  .stage-row .no { color: var(--text-2); white-space: nowrap; }
  .stage-row input { flex: 1; border: none; background: none; outline: none; font-size: 13px; text-align: right; font-weight: 700; color: var(--text); min-width: 0; }
  .stage-row .del { color: var(--danger); font-size: 12px; padding: 2px 8px; }
  .unit-mini { display: flex; background: #e6edf7; border-radius: 999px; padding: 2px; flex-shrink: 0; }
  .unit-mini button { font-size: 11px; padding: 4px 10px; border-radius: 999px; color: var(--text-2); }
  .unit-mini button.on { background: #fff; color: var(--primary-deep); font-weight: 700; box-shadow: 0 1px 4px rgba(70,100,140,.15); }
  /* 日常记录 */
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-light); color: var(--primary-deep); font-size: 15px; font-weight: 700; line-height: 1; }
  .stepper b { font-size: 14px; min-width: 64px; text-align: center; }
  .stepper b small { font-size: 10px; color: var(--text-3); font-weight: 400; }
  .day-card { background: #fff; border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 3px 12px rgba(70,100,140,.07); margin-bottom: 10px; cursor: pointer; }
  .day-card .dh { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .day-card .dh .r { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--primary-deep); font-size: 12px; }
  .day-card .dh .del { color: var(--danger); font-size: 12px; padding: 2px 6px; }
  .day-card .dl { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .day-card .dl.dim { color: var(--text-3); }
  /* 体重·日历 */
  .cal-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; padding: 2px 8px; margin-bottom: 4px; }
  .cal-head button { color: var(--primary-deep); font-size: 18px; padding: 0 10px; }
  .cal-week { display: grid; grid-template-columns: repeat(7,1fr); font-size: 10px; color: var(--text-3); text-align: center; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
  .cal-cell { background: #fff; border-radius: 12px; padding: 5px 2px; text-align: center; min-height: 54px; box-shadow: 0 2px 6px rgba(70,100,140,.05); }
  .cal-cell.today { outline: 2px solid var(--primary); }
  .cal-cell .d { font-size: 10px; color: var(--text-3); }
  .cal-cell .w { font-size: 13px; font-weight: 800; margin-top: 1px; }
  .cal-cell .cd { font-size: 9px; font-weight: 600; }
  .cal-cell .cd.down { color: var(--ok); }
  .cal-cell .cd.up { color: var(--danger); }
  .cal-cell.blank { background: none; box-shadow: none; }
  /* 打针 */
  .cal-cell { position: relative; }
  .inj-dot { position: absolute; top: 2px; right: 3px; font-size: 8px; line-height: 1; }
  .sheet-mask { position: fixed; inset: 0; background: rgba(30,40,55,.45); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); z-index: 41; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 24px rgba(0,0,0,.15); }
  .sheet h4 { font-size: 14px; text-align: center; }
  .sheet .fld { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); background: var(--bg); border-radius: 999px; padding: 6px 8px 6px 16px; }
  .sheet .fld input { border: none; background: none; outline: none; font-size: 13px; color: var(--text); text-align: right; }
  @media (min-width: 880px) { .sheet { left: 200px; } }

  /* ===== 提示 ===== */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(43,52,64,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; z-index: 99; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; }

  /* ===== 桌面端（≥880px）=====
     底部 Tab 变左侧胶囊导航，录入页左右分栏 */
  @media (min-width: 880px) {
    .tabbar { display: none; }
    #appView { padding-left: 200px; }
    .sidebar { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: 200px; background: #fff; border-right: 1px solid var(--border); padding: 20px 14px; flex-direction: column; gap: 4px; z-index: 20; }
    .sidebar .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; padding: 4px 10px 18px; }
    .sidebar .logo i { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-deep)); display: flex; align-items: center; justify-content: center; font-size: 15px; font-style: normal; }
    .sidebar button { text-align: left; padding: 10px 14px; border-radius: 999px; font-size: 13px; color: var(--text-2); }
    .sidebar button.on { background: var(--primary-light); color: var(--primary-deep); font-weight: 700; }
    .page { max-width: 980px; padding: 24px 24px 40px; }
    .add-grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
    .cam-fab { position: static; margin-top: 4px; }
    .cam-fab .circle { width: 100%; height: auto; border-radius: 999px; border: 2px dashed var(--primary); background: var(--primary-light); box-shadow: none; padding: 12px; font-size: 15px; color: var(--primary-deep); font-weight: 600; gap: 8px; }
    .cam-fab .circle::after { content: "拍照 / 上传图片识别"; }
    .cam-fab .cap { display: none; }
  }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="loginView">
  <div class="logo">🩺</div>
  <h1>生活记录</h1>
  <div class="sub" id="loginSub">登录后继续</div>
  <div class="field"><input type="text" id="loginUser" placeholder="账号" autocomplete="username"></div>
  <div class="field"><input type="password" id="loginPass" placeholder="密码" autocomplete="current-password"></div>
  <label class="check-row"><input type="checkbox" id="loginRemember" checked>记住密码，下次自动登录</label>
  <button class="btn" id="loginBtn">登 录</button>
</div>

<!-- ===== 主界面 ===== -->
<div id="appView">
  <nav class="sidebar" id="sidebar">
    <div class="logo"><i>🩺</i>生活记录</div>
  </nav>

  <!-- 录入页 -->
  <section class="page on" id="page-add">
    <h2 id="addTitle">记录体重</h2>
    <div class="add-grid">
      <div class="add-form">
        <div class="seg" id="kindSeg">
          <button data-kind="weight" class="on">⚖️ 体重</button>
          <button data-kind="bp">🩺 血压</button>
          <button data-kind="daily">🍽️ 日常</button>
        </div>
        <div id="bpForm" style="display:none">
          <div class="seg" id="medSeg">
            <button data-med="before" class="on">💊 服药前</button>
            <button data-med="after">服药后</button>
          </div>
          <div class="card">
            <div class="bp-row">
              <div class="bp-field"><input type="number" id="inSys" placeholder="--" min="40" max="300"><div class="k">收缩压 (高压)</div></div>
              <div class="bp-field"><input type="number" id="inDia" placeholder="--" min="20" max="200"><div class="k">舒张压 (低压)</div></div>
              <div class="bp-field"><input type="number" id="inHr" placeholder="--" min="20" max="250"><div class="k">心率</div></div>
            </div>
          </div>
        </div>
        <div id="weightForm" style="display:block">
          <div class="card weight-card">
            <button class="unit-toggle" id="unitToggle">kg ⇄ 斤</button>
            <div class="wv-wrap"><input type="number" id="inWeight" step="0.1" placeholder="--"><span class="wu" id="wUnitLabel">kg</span></div>
            <div class="hint" id="wHint" style="display:none"></div>
          </div>
          <div class="seg" id="fastSeg">
            <button data-fast="fasting" class="on">🍚 空腹</button>
            <button data-fast="full">非空腹</button>
          </div>
          <div class="meta-row" id="injToggle" style="cursor:pointer">
            <span>💉 同时记录打针（选填）</span><span id="injArrow">展开 ›</span>
          </div>
          <div id="injForm" style="display:none;flex-direction:column;gap:10px">
            <div class="meta-row"><span>🕐 打针时间</span><input type="time" id="injTime"></div>
            <div class="seg injConcSeg">
              <button data-c="2.5">2.5mg</button><button data-c="5" class="on">5mg</button><button data-c="7.5">7.5mg</button><button data-c="10">10mg</button>
            </div>
            <div class="meta-row"><span>📦 第几支</span><input type="number" id="injPen" min="1" placeholder="如 1"></div>
            <div class="meta-row"><span>🔢 第几针</span><input type="number" id="injShot" min="1" placeholder="如 1"></div>
          </div>
        </div>
        <div id="dailyForm" style="display:none;flex-direction:column;gap:10px">

<script>
'use strict';
/* ================= 工具 ================= */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem(k); }
};
let toastTimer = null;
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function fmtTs(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return '今天 ' + hm;
  if (d.toDateString() === yest.toDateString()) return '昨天 ' + hm;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}
function toLocalInputValue(ts) {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function isHigh(r) { return r.sys >= 140 || r.dia >= 90; }
function isLow(r) { return r.sys <= 90 || r.dia <= 60; }

/* 体重辅助 */
function kindOf(r) { return r.kind === 'weight' ? 'weight' : 'bp'; } // 老数据无 kind 视为血压
function kgToDisp(kg, unit) { return unit === 'jin' ? kg * 2 : kg; }
function dispToKg(v, unit) { return unit === 'jin' ? v / 2 : v; }
function fmtW(kg, unit) { return kgToDisp(kg, unit).toFixed(2) + ' ' + (unit === 'jin' ? '斤' : 'kg'); }
function bmiOf(kg) {
  const h = +getSettings().height;
  if (!h || !kg) return null;
  return Math.round(kg / Math.pow(h / 100, 2) * 10) / 10;
}
function bmiLabel(b) {
  if (b === null) return '';
  if (b < 18.5) return '偏瘦';
  if (b < 24) return '标准';
  if (b < 28) return '超重';
  return '肥胖';
}

/* ================= 数据层 ================= */
const K_ACCOUNT = 'bpx_account';   // {u, h, salt}
const K_REMEMBER = 'bpx_remember'; // {u, p} 记住密码
const K_RECORDS = 'bpx_records';   // [{id, owner, sys, dia, hr, ts, med, note}]
const K_INJ = 'bpx_injections';    // [{id, owner, ts, conc, pen, shot}] 打针记录
const K_DAILY = 'bpx_daily';       // [{id, owner, day, breakfast, lunch, dinner, snack, poop, period, waterMl, sleepH, sport, drinks}] 日常记录，一天一条
const K_SETTINGS = 'bpx_settings'; // {apiBase, model, apiKey}
const S_SESSION = 'bpx_session';   // sessionStorage: 已登录用户名

function getRecords() { return LS.get(K_RECORDS, []); }
function setRecords(list) { LS.set(K_RECORDS, list); }
function addRecord(r) { const l = getRecords(); l.push(r); setRecords(l); }
function delRecord(id) { setRecords(getRecords().filter(r => r.id !== id)); }

/* 打针记录：{id, owner, ts, conc, pen, shot} */
function getInj() { return LS.get(K_INJ, []); }
function setInj(list) { LS.set(K_INJ, list); }
function addInj(r) { const l = getInj(); l.push(r); setInj(l); }
function delInj(id) { setInj(getInj().filter(r => r.id !== id)); }
function injByDayKey(k) { return getInj().filter(r => dayKey(r.ts) === k).sort((a, b) => b.ts - a.ts); }

/* 日常记录：一天一条（按 day 覆盖更新） */
function getDaily() { return LS.get(K_DAILY, []); }
function setDaily(list) { LS.set(K_DAILY, list); }
function dailyByDay(k) { return getDaily().find(r => r.day === k) || null; }
function upsertDaily(rec) {
  const l = getDaily();
  const i = l.findIndex(r => r.day === rec.day);
  if (i >= 0) l[i] = rec;
  else l.push(rec);
  setDaily(l);
}
function delDaily(id) { setDaily(getDaily().filter(r => r.id !== id)); }

/* 简单散列（crypto.subtle 不可用时兜底） */
async function hashPass(salt, pass) {
  const text = salt + '::' + pass;
  if (crypto.subtle && window.isSecureContext) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < text.length; i++) {
    const ch = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
</script>

<script>
'use strict';
/* ================= 登录 ================= */
function currentUser() { return sessionStorage.getItem(S_SESSION); }

async function doLogin() {
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  if (!u || !p) { toast('请输入账号和密码'); return; }
  const acc = LS.get(K_ACCOUNT, null);

  if (!acc) {
    // 首次使用：注册
    const salt = Math.random().toString(36).slice(2, 10);
    const h = await hashPass(salt, p);
    LS.set(K_ACCOUNT, { u, h, salt });
    toast('账号已创建，欢迎使用');
  } else {
    if (acc.u !== u) { toast('账号不存在'); return; }
    const h = await hashPass(acc.salt, p);
    if (h !== acc.h) { toast('密码不正确'); return; }
  }

  if ($('#loginRemember').checked) LS.set(K_REMEMBER, { u, p });
  else LS.del(K_REMEMBER);

  sessionStorage.setItem(S_SESSION, u);
  enterApp();
}

async function tryAutoLogin() {
  const saved = LS.get(K_REMEMBER, null);
  if (!saved) return;
  const acc = LS.get(K_ACCOUNT, null);
  if (!acc || acc.u !== saved.u) return;
  const h = await hashPass(acc.salt, saved.p);
  if (h === acc.h) {
    sessionStorage.setItem(S_SESSION, saved.u);
    enterApp();
  }
}

function logout() {
  sessionStorage.removeItem(S_SESSION);
  location.reload();
}

/* ================= 导航 ================= */

  ['add', '✎', '录入'],
  ['history', '☰', '记录'],

/* ================= 录入页 ================= */
let curMed = 'before';
let curKind = 'weight';  // 'bp' | 'weight'，默认体重
let curFast = 'fasting'; // 'fasting' | 'full'
let curUnit = 'kg';      // 当前体重输入单位（kg / jin）

function applyKind() {
  const isW = curKind === 'weight';
  const isD = curKind === 'daily';
  $('#addTitle').textContent = isW ? '记录体重' : isD ? '记录日常' : '记录血压';
  $('#bpForm').style.display = isW || isD ? 'none' : 'contents';
  $('#weightForm').style.display = isW ? 'block' : 'none';
  $('#dailyForm').style.display = isD ? 'flex' : 'none';
  $('#timeRow').style.display = isD ? 'none' : '';
  $('#inNote').style.display = isD ? 'none' : '';
  $('#camBtn').style.display = isD ? 'none' : '';
  $('#camCap').textContent = isW ? '拍体重秤' : '拍血压计';
  $$('#kindSeg button').forEach(b => b.classList.toggle('on', b.dataset.kind === curKind));
  if (isW) { setUnit(getSettings().unit || 'kg', true); updateWeightHint(); }
  if (isD) prefillDailyForm(dayKey(Date.now()));
}

function setUnit(u, keepValue) {
  const inp = $('#inWeight');
  const v = parseFloat(inp.value);
  if (keepValue && !isNaN(v)) inp.value = kgToDisp(dispToKg(v, curUnit), u).toFixed(2);
  curUnit = u;
  $('#wUnitLabel').textContent = u === 'jin' ? '斤' : 'kg';
  $('#unitToggle').textContent = (u === 'jin' ? '斤' : 'kg') + ' ⇄ ' + (u === 'jin' ? 'kg' : '斤');
  updateWeightHint();
}

function lastWeightKg() {
  const list = getRecords().filter(r => kindOf(r) === 'weight').sort((a, b) => b.ts - a.ts);
  return list.length ? list[0].kg : null;
}
function updateWeightHint() {
  const el = $('#wHint');
  const v = parseFloat($('#inWeight').value);
  const prev = lastWeightKg();
  if (isNaN(v) || prev === null) { el.style.display = 'none'; return; }
  const diff = Math.round((dispToKg(v, curUnit) - prev) * 100) / 100;
  if (diff === 0) { el.style.display = 'none'; return; }
  const d = Math.abs(kgToDisp(diff, curUnit));
  const u = curUnit === 'jin' ? '斤' : 'kg';
  el.style.display = '';
  el.className = 'hint ' + (diff < 0 ? 'down' : 'up');
  el.textContent = `较上次 ${diff < 0 ? '↓' : '↑'} ${d.toFixed(2)} ${u}`;
}

function resetAddForm() {
  $('#inSys').value = '';
  $('#inDia').value = '';
  $('#inHr').value = '';
  $('#inWeight').value = '';
  $('#wHint').style.display = 'none';
  $('#inNote').value = '';
  $('#inTime').value = toLocalInputValue(Date.now());
  // 按时间段默认空腹状态：0:00–14:00 空腹，14:01 起非空腹
  const now = new Date();
  curFast = (now.getHours() * 60 + now.getMinutes()) <= 840 ? 'fasting' : 'full';
  $$('#fastSeg button').forEach(b => b.classList.toggle('on', b.dataset.fast === curFast));
  $('#injForm').style.display = 'none';
  $('#injArrow').textContent = '展开 ›';
  $('#injTime').value = '';
  $('#injPen').value = '';
  $('#injShot').value = '';
  if (curKind === 'daily') prefillDailyForm(dayKey(Date.now()));
  markBadInputs();
}
function markBadInputs() {
  const sys = +$('#inSys').value, dia = +$('#inDia').value;
  $('#inSys').classList.toggle('bad', sys >= 140 || (sys > 0 && sys <= 90));
  $('#inDia').classList.toggle('bad', dia >= 90 || (dia > 0 && dia <= 60));
}

function saveRecord() {
  const ts = $('#inTime').value ? new Date($('#inTime').value).getTime() : Date.now();
  const base = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    owner: currentUser(), // 预留多人字段
    ts,
    note: $('#inNote').value.trim()
  };
  if (curKind === 'weight') {
    const v = parseFloat($('#inWeight').value);
    if (isNaN(v) || v <= 0) { toast('请填写体重'); return; }
    let inj = null;
    if (injFormOpen()) {
      inj = collectInj(ts, '#injTime', '#injPen', '#injShot', $('#injForm .injConcSeg'));
      if (!inj) return;
    }
    addRecord(Object.assign(base, { kind: 'weight', kg: Math.round(dispToKg(v, curUnit) * 100) / 100, fast: curFast }));
    if (inj) addInj(inj);
  } else if (curKind === 'daily') {
    const dayVal = $('#dDate').value;
    if (!dayVal) { toast('请选择日期'); return; }
    const [y, m, dd] = dayVal.split('-').map(Number);
    const rec = {
      id: dailyByDay(y * 10000 + m * 100 + dd)?.id || base.id,
      owner: currentUser(),
      day: y * 10000 + m * 100 + dd,
      breakfast: $('#dBreakfast').value.trim(),
      lunch: $('#dLunch').value.trim(),
      dinner: $('#dDinner').value.trim(),
      snack: $('#dSnack').value.trim(),
      poop: dFlags.poop,
      period: dFlags.period,
      waterMl: dWater,
      sleepH: dSleep,
      sport: $('#dSport').value.trim(),
      drinks: $('#dDrinks').value.trim()
    };
    if (!rec.breakfast && !rec.lunch && !rec.dinner && !rec.snack && !rec.sport && !rec.drinks
        && !rec.poop && !rec.period && !rec.waterMl && !rec.sleepH) {
      toast('至少填写一项'); return;
    }
    upsertDaily(rec);
  } else {
    const sys = +$('#inSys').value, dia = +$('#inDia').value, hr = +$('#inHr').value;
    if (!sys || !dia) { toast('请填写收缩压和舒张压'); return; }
    addRecord(Object.assign(base, { kind: 'bp', sys, dia, hr: hr || null, med: curMed }));
  }
  toast(curKind === 'weight' && injFormOpen() ? '体重 + 打针已保存 ✓' : '已保存 ✓');
  resetAddForm();
  renderRecent();
}

/* ================= 记录列表 ================= */
function weightChangeHTML(r, sortedAsc) {
  const st = r.fast || 'fasting';
  const same = sortedAsc.filter(x => (x.fast || 'fasting') === st);
  const i = same.findIndex(x => x.id === r.id);
  if (i <= 0) return '<small>—</small>';
  const unit = getSettings().unit || 'kg';
  const diff = kgToDisp(r.kg - same[i - 1].kg, unit);
  if (Math.abs(diff) < 0.005) return '<small>持平</small>';
  const lab = st === 'full' ? '非空腹' : '空腹';
  return `<small>较上次${lab} ${diff < 0 ? '↓' : '↑'} ${Math.abs(diff).toFixed(2)}</small>`;
}
function recItemHTML(r, wAsc) {
  if (kindOf(r) === 'weight') {
    const unit = getSettings().unit || 'kg';
    const bmi = bmiOf(r.kg);
    return `<div class="rec" data-id="${r.id}">
      <div class="nums">
        <div class="bp">${fmtW(r.kg, unit)}${wAsc ? weightChangeHTML(r, wAsc) : ''}</div>
        <div class="t">${fmtTs(r.ts)}${bmi !== null ? ` · BMI ${bmi}` : ''}</div>
        ${r.note ? `<div class="note">📝 ${r.note}</div>` : ''}
      </div>
      <span class="pill ${r.fast}">${r.fast === 'fasting' ? '空腹' : '非空腹'}</span>
      <button class="del" title="删除">✕</button>
    </div>`;
  }
  const bad = isHigh(r) || isLow(r);
  const tag = isHigh(r) ? ' · 偏高' : (isLow(r) ? ' · 偏低' : '');
  return `<div class="rec" data-id="${r.id}">
    <div class="nums">
      <div class="bp${bad ? ' bad' : ''}">${r.sys}/${r.dia}${r.hr ? `<small>❤ ${r.hr}</small>` : ''}</div>
      <div class="t">${fmtTs(r.ts)}${tag}</div>
      ${r.note ? `<div class="note">📝 ${r.note}</div>` : ''}
    </div>
    <span class="pill ${r.med}">${r.med === 'before' ? '服药前' : '服药后'}</span>
    <button class="del" title="删除">✕</button>
  </div>`;
}

let histFilter = 'all';
let histKind = 'weight';
let histView = 'list';      // 体重模式：list | cal | inj
let histUnit = 'kg';        // 记录页展示单位（默认 kg，可切换斤）
let calCursor = null;       // {y, m} 日历当前月份

function renderHistory() {
  const isW = histKind === 'weight';

  $('#histSeg').style.display = isW || isD ? 'none' : '';
  $('#histSegW').style.display = 'none';

/* ---------- 体重：统计卡 ---------- */
function renderWeightStat() {
  const el = $('#weightStatCard');
  const unit = histUnit;
  const asc = getRecords().filter(r => kindOf(r) === 'weight').sort((a, b) => a.ts - b.ts);
  if (!asc.length) { el.innerHTML = '<div class="stat-sub">还没有体重记录，去录入一条吧</div>'; return; }
  const first = asc[0], latest = asc[asc.length - 1];
  const diff = kgToDisp(latest.kg - first.kg, unit);
  const u = unit === 'jin' ? '斤' : 'kg';
  let main;
  if (Math.abs(diff) < 0.005) main = '📊 累计 持平';
  else if (diff < 0) main = `📉 累计 <span class="g">↓ ${Math.abs(diff).toFixed(2)} ${u}</span>`;
  else main = `📈 累计 <span class="r">↑ ${Math.abs(diff).toFixed(2)} ${u}</span>`;
  const fd = new Date(first.ts);
  const sub = asc.length > 1
    ? `相比最初 ${fmtW(first.kg, unit)}（${fd.getMonth() + 1}月${fd.getDate()}日 首次记录）`
    : '这是第一条体重记录';
  const minRec = asc.reduce((m, r) => (r.kg < m.kg ? r : m), asc[0]);
  const md = new Date(minRec.ts);
  const minLine = `🏆 历史最低 ${fmtW(minRec.kg, unit)}（${md.getMonth() + 1}月${md.getDate()}日）`;
  const bmi = bmiOf(latest.kg);
  const bmiLine = bmi !== null
    ? `BMI ${bmi} · ${bmiLabel(bmi)} · 身高 ${getSettings().height}cm`
    : '在设置页填写身高后可显示 BMI';
  el.innerHTML = `<div class="stat-main">${main}</div><div class="stat-sub">${sub}</div><div class="stat-sub">${minLine}</div><div class="stat-sub">${bmiLine}</div>`;
}

/* ---------- 体重：阶段目标卡 ---------- */
function renderStageCard() {
  const el = $('#stageCard');
  const s = stageState();
  if (!s) { el.style.display = 'none'; return; }
  el.style.display = '';
  const unit = histUnit;
  const u = unit === 'jin' ? '斤' : 'kg';
  const w = (kg) => kgToDisp(kg, unit).toFixed(2);
  if (s.allDone) {
    el.innerHTML = `<div class="stage-big">🎉 全部阶段目标已达成！</div>` +
      s.stages.map((t, i) => `<div class="stage-done">✅ 第${i + 1}阶段 ${w(t)} ${u}</div>`).join('');
    return;
  }
  const t = s.stages[s.idx];
  const diff = kgToDisp(s.cur - t, unit);
  const doneLines = s.stages.slice(0, s.idx).map((tg, i) => {
    const ts = s.doneTs(tg);
    const d = ts ? new Date(ts) : null;
    return `<div class="stage-done">✅ 第${i + 1}阶段 ${w(tg)} ${u}${d ? ` · 已于 ${d.getMonth() + 1}月${d.getDate()}日 达成` : ''}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="stage-now">🎯 第${s.idx + 1}阶段目标 ${w(t)} ${u}</div>
    <div class="stage-big">还差 ${diff.toFixed(2)} ${u} <small>当前 ${w(s.cur)} ${u}</small></div>
    <div class="stage-bar"><i style="width:${Math.round(s.pct)}%"></i></div>
    ${doneLines}`;
}

/* ---------- 体重：行式列表 ---------- */
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function hm(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that) / 864e5);
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  if (diff === 0) return ['今天', md];
  if (diff === 1) return ['昨天', md];
  if (diff >= 2 && diff <= 7) return ['周' + '日一二三四五六'[d.getDay()], md];
  return ['', md];
}
function weightDays() {
  const map = new Map();
  getRecords().filter(r => kindOf(r) === 'weight').forEach(r => {
    const k = dayKey(r.ts);
    if (!map.has(k)) map.set(k, { key: k, ts: 0, fasting: null, full: null });
    const g = map.get(k);
    g.ts = Math.max(g.ts, r.ts);
    const st = (r.fast || 'fasting') === 'full' ? 'full' : 'fasting';
    if (!g[st] || r.ts > g[st].ts) g[st] = r; // 同状态多条取最新
  });
  return Array.from(map.values()).sort((a, b) => a.key - b.key);
}
function renderWeightRows() {
  const unit = histUnit;
  const days = weightDays();
  const wrap = $('#wListWrap');
  if (!days.length) { wrap.innerHTML = '<div class="empty">还没有体重记录，去录入一条吧</div>'; return; }
  const injKeys = new Set(getInj().map(r => dayKey(r.ts)));
  const cell = (r) => r
    ? `<span class="c-w" data-id="${r.id}" title="点击可删除">${kgToDisp(r.kg, unit).toFixed(2)}<small>${hm(r.ts)}</small></span>`
    : '<span class="c-w none">—</span>';
  // 空腹较前日（上一个有空腹记录的日子）
  let prevFast = null;
  const rows = days.map(g => {
    let df = '<span class="c-df flat">—</span>';
    if (g.fasting) {
      if (prevFast !== null) {
        const diff = kgToDisp(g.fasting.kg - prevFast, unit);
        if (Math.abs(diff) < 0.005) df = '<span class="c-df flat">持平</span>';
        else df = `<span class="c-df ${diff < 0 ? 'down' : 'up'}">${diff < 0 ? '↓' : '↑'}${Math.abs(diff).toFixed(2)}</span>`;
      }
      prevFast = g.fasting.kg;
    }
    const [lab, md] = dayLabel(g.ts);
    const injMark = injKeys.has(g.key) ? '💉' : '';
    return `<div class="wrow"><span class="c-date">${lab}<small>${md}${injMark}</small></span>${cell(g.fasting)}${cell(g.full)}${df}</div>`;
  }).reverse().join('');
  wrap.innerHTML = `<div class="wtab"><div class="wrow head"><span class="c-date">日期</span><span class="c-w">🍚 空腹</span><span class="c-w">🌙 非空腹</span><span class="c-df">较前日</span></div>${rows}</div>`;
}

/* ---------- 体重：日历 ---------- */
function renderWeightCal() {
  const unit = histUnit;
  const wrap = $('#wCalWrap');
  if (!calCursor) { const n = new Date(); calCursor = { y: n.getFullYear(), m: n.getMonth() }; }
  const { y, m } = calCursor;
  // 当月每天的空腹最新值
  const days = weightDays().filter(g => g.fasting);
  const fastByKey = new Map(days.map(g => [g.key, g.fasting.kg]));
  const injKeys = new Set(getInj().map(r => dayKey(r.ts)));
  // 每格与上一个有空腹记录的日子对比
  const blanks = (new Date(y, m, 1).getDay() + 6) % 7; // 周一开头
  const dim = new Date(y, m + 1, 0).getDate();
  const now = new Date();
  const todayKey = dayKey(now.getTime());
  const diffOf = (k, kg) => {
    // 找该日之前的最近空腹记录
    const prev = days.filter(g => g.key < k).pop();
    if (!prev) return '<div class="cd" style="color:var(--text-3)">首日</div>';
    const diff = kgToDisp(kg - prev.fasting.kg, unit);
    if (Math.abs(diff) < 0.005) return '<div class="cd">持平</div>';
    return `<div class="cd ${diff < 0 ? 'down' : 'up'}">${diff < 0 ? '↓' : '↑'}${Math.abs(diff).toFixed(2)}</div>`;
  };
  let cells = '<div class="cal-cell blank"></div>'.repeat(blanks);
  for (let d = 1; d <= dim; d++) {
    const k = y * 10000 + (m + 1) * 100 + d;
    const kg = fastByKey.get(k);
    const cls = 'cal-cell' + (k === todayKey ? ' today' : '');
    const dot = injKeys.has(k) ? '<span class="inj-dot">💉</span>' : '';
    cells += `<div class="${cls}" data-day="${k}" style="cursor:pointer">${dot}<div class="d">${d}</div>` +
      (kg !== undefined
        ? `<div class="w">${kgToDisp(kg, unit).toFixed(2)}</div>${diffOf(k, kg)}`
        : '<div class="w" style="color:var(--text-3)">—</div>') +
      '</div>';
  }
  // 当月总计：当月最后一次空腹 − 此前最后一次空腹
  const mStart = y * 10000 + (m + 1) * 100 + 1;
  const inMonth = days.filter(g => g.key >= mStart && g.key <= mStart + 30);
  const before = days.filter(g => g.key < mStart).pop();
  let monthTotal = '';
  if (inMonth.length && before) {
    const diff = kgToDisp(inMonth[inMonth.length - 1].fasting.kg - before.fasting.kg, unit);
    monthTotal = Math.abs(diff) < 0.005
      ? ' <span style="font-size:11px;color:var(--text-3)">持平</span>'
      : ` <span style="font-size:11px;color:${diff < 0 ? 'var(--ok)' : 'var(--danger)'}">${diff < 0 ? '↓' : '↑'}${Math.abs(diff).toFixed(2)} ${unit === 'jin' ? '斤' : 'kg'}</span>`;
  }
  wrap.innerHTML = `
    <div class="cal-head"><button id="calPrev">‹</button><b>${y}年${m + 1}月${monthTotal}</b><button id="calNext">›</button></div>
    <div class="cal-week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="cal-grid">${cells}</div>`;
  $('#calPrev').onclick = () => { calCursor.m--; if (calCursor.m < 0) { calCursor.m = 11; calCursor.y--; } renderWeightCal(); };
  $('#calNext').onclick = () => { calCursor.m++; if (calCursor.m > 11) { calCursor.m = 0; calCursor.y++; } renderWeightCal(); };
  wrap.querySelector('.cal-grid').addEventListener('click', e => {
    const cellEl = e.target.closest('.cal-cell[data-day]');
    if (cellEl) openInjSheet(+cellEl.dataset.day);
  });
}

/* ---------- 打针记录 ---------- */
function injFormOpen() { return $('#injForm').style.display !== 'none'; }
function injConcOf(segEl) { return segEl.querySelector('button.on')?.dataset.c || '5'; }
// 从一组输入采集打针记录；dateTs 提供日期，time 输入提供时分。校验失败返回 null
function collectInj(dateTs, timeId, penId, shotId, concSeg) {
  const pen = parseInt($(penId).value, 10);
  const shot = parseInt($(shotId).value, 10);
  if (!(pen >= 1)) { toast('请填写第几支'); return null; }
  if (!(shot >= 1)) { toast('请填写第几针'); return null; }
  const d = new Date(dateTs);
  const t = ($(timeId).value || '').split(':');
  if (t.length === 2 && t[0] !== '') d.setHours(+t[0], +t[1], 0, 0);
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    owner: currentUser(),
    ts: d.getTime(),
    conc: injConcOf(concSeg),
    pen, shot
  };
}

/* 打针视图：行式列表，每针一行 + 当天空腹体重（较上一针涨跌） */
function renderInjRows() {
  const wrap = $('#wInjWrap');
  const unit = histUnit;
  const list = getInj().sort((a, b) => b.ts - a.ts);
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">还没有打针记录，可在录入体重时展开"同时记录打针"，或在日历页点日期补录</div>';
    return;
  }
  const fastByKey = new Map(weightDays().map(g => [g.key, g.fasting]));
  // 按时间正序找出每一针的"上一针空腹体重"（跳过没记空腹的针）
  const prevFastById = new Map();
  let prevKg = null;
  list.slice().reverse().forEach(r => {
    const f = fastByKey.get(dayKey(r.ts));
    prevFastById.set(r.id, f ? prevKg : undefined);
    if (f) prevKg = f.kg;
  });
  const rows = list.map(r => {
    const f = fastByKey.get(dayKey(r.ts));
    const d = new Date(r.ts);
    let fCell = '<span class="c-df flat">—</span>';
    if (f) {
      const cur = kgToDisp(f.kg, unit).toFixed(2);
      const prev = prevFastById.get(r.id);
      if (prev === null || prev === undefined) {
        fCell = `<span class="c-df flat">${cur}</span>`;
      } else {
        const diff = kgToDisp(f.kg - prev, unit);
        if (Math.abs(diff) < 0.005) fCell = `<span class="c-df flat">${cur}<small>持平</small></span>`;
        else fCell = `<span class="c-df ${diff < 0 ? 'down' : 'up'}">${cur}<small>${diff < 0 ? '↓' : '↑'}${Math.abs(diff).toFixed(2)}</small></span>`;
      }
    }
    return `<div class="wrow" data-id="${r.id}" title="点击可删除">
      <span class="c-date">${d.getMonth() + 1}月${d.getDate()}日<small>${hm(r.ts)}</small></span>
      <span class="c-w">${r.conc}<small>mg</small></span>
      <span class="c-w">${r.pen}·${r.shot}<small>支·针</small></span>
      ${fCell}
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="wtab"><div class="wrow head"><span class="c-date">日期</span><span class="c-w">浓度</span><span class="c-w">支·针</span><span class="c-df">🍚空腹</span></div>${rows}</div>`;
}

/* ---------- 日常：按月历史卡片 ---------- */
let dailyCursor = null; // {y, m}
function renderDailyList() {
  const wrap = $('#dListWrap');
  if (!dailyCursor) { const n = new Date(); dailyCursor = { y: n.getFullYear(), m: n.getMonth() }; }
  const { y, m } = dailyCursor;
  const list = getDaily()
    .filter(r => Math.floor(r.day / 10000) === y && Math.floor(r.day / 100) % 100 === m + 1)
    .sort((a, b) => b.day - a.day);
  // 每天的最新体重（取当天任意状态的最后一条）
  const wByDay = new Map();
  getRecords().filter(r => kindOf(r) === 'weight').forEach(r => {
    const k = dayKey(r.ts);
    if (!wByDay.has(k) || wByDay.get(k).ts < r.ts) wByDay.set(k, r);
  });
  const unit = histUnit;
  const cards = list.map(r => {
    const ts = new Date(Math.floor(r.day / 10000), Math.floor(r.day / 100) % 100 - 1, r.day % 100, 12).getTime();
    const [lab, md] = dayLabel(ts);
    const w = wByDay.get(r.day);
    const lines = [];
    if (r.breakfast) lines.push(`🌅 ${r.breakfast}`);
    if (r.lunch) lines.push(`☀️ ${r.lunch}`);
    if (r.dinner) lines.push(`🌙 ${r.dinner}`);
    if (r.snack) lines.push(`🍪 ${r.snack}`);
    const dim = [];
    if (r.waterMl) dim.push(`🥛 ${r.waterMl}ml`);
    if (r.drinks) dim.push(`🥤 ${r.drinks}`);
    if (r.sleepH) dim.push(`😴 ${r.sleepH}h`);
    if (r.sport) dim.push(`🏃 ${r.sport}`);
    if (r.poop) dim.push('💩');
    if (r.period) dim.push('🩸');
    return `<div class="day-card" data-day="${r.day}">
      <div class="dh"><span>${lab ? lab + ' ' : ''}${md}</span>
        <span class="r">${w ? '⚖️ ' + kgToDisp(w.kg, unit).toFixed(2) : ''}<button class="del" data-id="${r.id}" title="删除">✕</button></span>
      </div>
      ${lines.map(l => `<div class="dl">${l}</div>`).join('')}
      ${dim.length ? `<div class="dl dim">${dim.join(' · ')}</div>` : ''}
    </div>`;
  }).join('');
  wrap.innerHTML = `
    <div class="cal-head"><button id="dPrev">‹</button><b>${y}年${m + 1}月</b><button id="dNext">›</button></div>
    ${cards || '<div class="empty">这个月还没有日常记录</div>'}`;
  $('#dPrev').onclick = () => { dailyCursor.m--; if (dailyCursor.m < 0) { dailyCursor.m = 11; dailyCursor.y--; } renderDailyList(); };
  $('#dNext').onclick = () => { dailyCursor.m++; if (dailyCursor.m > 11) { dailyCursor.m = 0; dailyCursor.y++; } renderDailyList(); };
}

/* 打针弹层：日历点日期打开；一天一针（重复保存覆盖当天旧记录） */
let injSheetDay = null; // 当前弹层对应的 dayKey
function openInjSheet(k) {
  injSheetDay = k;
  const d = new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100);
  $('#sInjTitle').textContent = `💉 ${d.getMonth() + 1}月${d.getDate()}日 · 记录打针`;
  const old = injByDayKey(k)[0];
  $('#sInjTime').value = old ? hm(old.ts) : '';

function drawChart() {
  updateBmiCard();
  const isW = chartKind === 'weight';
  $('#chartLegend').innerHTML = isW
    ? `<span><i style="background:#4a8dff"></i>体重</span><span><i style="background:#6b54d3"></i>目标体重</span>`
    : `<span><i style="background:#f0564f"></i>收缩压</span><span><i style="background:#4a8dff"></i>舒张压</span><span><i style="background:#3fbb7a"></i>心率</span>`;

  const cv = $('#chartCanvas');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || cv.parentElement.clientWidth - 28;
  const H = 220;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const since = Date.now() - chartDays * 864e5;
  const data = getRecords()
    .filter(r => kindOf(r) === chartKind && r.ts >= since)
    .filter(r => chartFilter === 'all' || (isW ? r.fast === chartFilter : r.med === chartFilter))
    .sort((a, b) => a.ts - b.ts);

  const padL = 34, padR = 10, padT = 12, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  if (data.length === 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9aa4b0';
    ctx.font = '13px sans-serif';
    ctx.fillText(`近${chartDays}天暂无数据`, W / 2, H / 2);
    return;
  }

  // 数值范围
  let vMin, vMax;
  const target = currentStageTargetKg();
  if (isW) {
    vMin = Math.min(...data.map(r => r.kg));
    vMax = Math.max(...data.map(r => r.kg));
    if (target) { vMin = Math.min(vMin, target); vMax = Math.max(vMax, target); }
    vMin = Math.floor(vMin - 1);
    vMax = Math.ceil(vMax + 1);
    if (vMax - vMin < 4) vMax = vMin + 4;
  } else {
    vMin = 40; vMax = 160;
    data.forEach(r => {
      vMin = Math.min(vMin, r.dia, r.hr || 999);
      vMax = Math.max(vMax, r.sys);
    });
    vMin = Math.floor((vMin - 10) / 10) * 10;
    vMax = Math.ceil((vMax + 10) / 10) * 10;
  }

  const x = (i) => padL + (data.length === 1 ? plotW / 2 : (i / (data.length - 1)) * plotW);
  const y = (v) => padT + plotH - ((v - vMin) / (vMax - vMin)) * plotH;

  // 网格与刻度
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#9aa4b0';
  ctx.strokeStyle = '#eef2f8';
  ctx.textAlign = 'right';
  const step = isW ? Math.max(1, Math.round((vMax - vMin) / 5)) : Math.max(10, Math.round((vMax - vMin) / 5 / 10) * 10);
  for (let v = vMin; v <= vMax; v += step) {
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(W - padR, y(v)); ctx.stroke();
    ctx.fillText(v, padL - 6, y(v) + 3);
  }
  // 参考线：血压 140 警戒线 / 体重目标线
  if (!isW && 140 >= vMin && 140 <= vMax) {
    ctx.strokeStyle = 'rgba(240,86,79,.5)';
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, y(140)); ctx.lineTo(W - padR, y(140)); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (isW && target && target >= vMin && target <= vMax) {
    ctx.strokeStyle = 'rgba(107,84,211,.6)';
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, y(target)); ctx.lineTo(W - padR, y(target)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6b54d3';
    ctx.textAlign = 'left';
    ctx.fillText(`目标 ${target}kg`, padL + 4, y(target) - 4);
  }
  // 日期刻度（首尾）
  ctx.fillStyle = '#9aa4b0';
  ctx.textAlign = 'left';
  ctx.fillText(fmtTs(data[0].ts), padL, H - 8);
  ctx.textAlign = 'right';
  ctx.fillText(fmtTs(data[data.length - 1].ts), W - padR, H - 8);

  function line(get, color, dash) {
    const pts = data.map((r, i) => [x(i), get(r)]).filter(p => p[1] !== null && p[1] !== undefined);
    if (!pts.length) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], y(p[1])) : ctx.moveTo(p[0], y(p[1])));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], y(p[1]), 3, 0, 7); ctx.fill(); });
  }
  if (isW) {
    line(r => r.kg, '#4a8dff');
  } else {
    line(r => r.sys, '#f0564f');
    line(r => r.dia, '#4a8dff');
    line(r => r.hr, '#3fbb7a', [4, 3]);
  }
}

const DEFAULT_SETTINGS = {
  apiBase: 'https://api.moonshot.cn/v1',
  model: 'kimi-k2.6',
  apiKey: '',
  height: '',   // cm，用于 BMI
  target: '',   // 旧版单一目标体重 kg（兼容用，展示时迁移为 stages[0]）
  stages: [],   // 阶段目标体重 [kg, ...]，按顺序依次达成
  unit: 'kg'    // 体重默认单位 kg / jin
};
function getSettings() { return Object.assign({}, DEFAULT_SETTINGS, LS.get(K_SETTINGS, {})); }

/* 阶段目标（kg 数值数组，按顺序依次达成；兼容旧的单一 target） */
function getStages() {
  const st = getSettings();
  const arr = Array.isArray(st.stages) ? st.stages.map(Number).filter(x => x > 0) : [];
  if (arr.length) return arr;
  return +st.target > 0 ? [+st.target] : [];
}
/* 当前阶段信息：最新体重 vs 阶段列表 */
function stageState() {
  const stages = getStages();
  if (!stages.length) return null;
  const cur = lastWeightKg();
  if (cur === null) return null;
  const asc = getRecords().filter(r => kindOf(r) === 'weight').sort((a, b) => a.ts - b.ts);
  const firstKg = asc.length ? asc[0].kg : cur;
  const idx = stages.findIndex(t => cur > t); // 第一个未达成的阶段
  const doneTs = (t) => { const r = asc.find(x => x.kg <= t); return r ? r.ts : null; };
  if (idx === -1) return { allDone: true, stages, doneTs };
  const fromKg = idx > 0 ? stages[idx - 1] : firstKg; // 进度条起点：上一阶段或首次记录
  const span = fromKg - stages[idx];
  const pct = span > 0 ? Math.min(100, Math.max(0, (fromKg - cur) / span * 100)) : 100;
  return { allDone: false, idx, cur, stages, pct, doneTs };
}
/* 图表目标线：最近的未达标阶段 */
function currentStageTargetKg() {
  const s = stageState();
  return s && !s.allDone ? s.stages[s.idx] : null;
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1024;
      let { width, height } = img;
      if (Math.max(width, height) > MAX) {
        const k = MAX / Math.max(width, height);
        width = Math.round(width * k);
        height = Math.round(height * k);
      }
      const cv = document.createElement('canvas');
      cv.width = width; cv.height = height;
      cv.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(cv.toDataURL('image/jpeg', 0.85));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function recognizePhoto(file) {
  const st = getSettings();
  if (!st.apiKey) {
    toast('请先在"设置"页配置 API Key', 3000);
    goPage('settings');
    return;
  }
  const isW = curKind === 'weight';
  const prompt = isW
    ? '这是一张体重秤屏幕的照片。请识别屏幕上显示的体重数值，只返回 JSON，格式为 {"weight": 体重数值(数字,单位kg,若屏幕显示的是斤则换算为kg)}，不要返回任何其他内容。'
    : '这是一张血压计屏幕的照片。请识别屏幕上显示的血压和心率数值，只返回 JSON，格式为 {"systolic": 收缩压整数, "diastolic": 舒张压整数, "heart_rate": 心率整数或null}，不要返回任何其他内容。';
  const circle = $('#camBtn .circle');
  circle.classList.add('busy');
  toast('识别中…', 60000);
  try {
    const dataUrl = await compressImage(file);
    const resp = await fetch(st.apiBase.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + st.apiKey
      },
      body: JSON.stringify({
        model: st.model,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: prompt },
            { type: 'image_url', image_url: { url: dataUrl } }
          ]
        }]
      })
    });
    if (!resp.ok) {
      const t = await resp.text();
      throw new Error('接口返回 ' + resp.status + '：' + t.slice(0, 120));
    }
    const json = await resp.json();
    const text = json.choices?.[0]?.message?.content || '';
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('未识别到数值，请手动输入');
    const v = JSON.parse(m[0]);
    if (isW) {
      if (!v.weight) throw new Error('未识别到数值，请手动输入');
      $('#inWeight').value = kgToDisp(+v.weight, curUnit).toFixed(2);
      updateWeightHint();
    } else {
      if (v.systolic) $('#inSys').value = Math.round(v.systolic);
      if (v.diastolic) $('#inDia').value = Math.round(v.diastolic);
      if (v.heart_rate) $('#inHr').value = Math.round(v.heart_rate);
      markBadInputs();
      if (!$('#inSys').value && !$('#inDia').value) throw new Error('未识别到数值，请手动输入');
    }
    toast('识别完成，请确认后保存 ✓');
  } catch (e) {
    toast(e.message || '识别失败，请手动输入', 3500);
  } finally {
    circle.classList.remove('busy');
  }
}

}

function importJson(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      let data = JSON.parse(rd.result);
      let injs = [];
      let daily = [];
      if (!Array.isArray(data)) {
        // 新格式：{records, injections, daily}
        injs = Array.isArray(data.injections) ? data.injections : [];
        daily = Array.isArray(data.daily) ? data.daily : [];
        data = Array.isArray(data.records) ? data.records : [];
      }
      const valid = data.filter(r => r && r.ts && ((r.sys && r.dia) || (kindOf(r) === 'weight' && r.kg)));
      const validInj = injs.filter(r => r && r.ts && (r.pen >= 1 || r.shot >= 1 || r.doseMl > 0));
      const validDaily = daily.filter(r => r && r.day);
      if (!valid.length && !validInj.length && !validDaily.length) throw new Error();
      const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const existing = new Set(getRecords().map(r => r.id));
      const merged = getRecords().concat(valid.map(r => {
        const base = {
          id: existing.has(r.id) ? r.id + '_imp' : (r.id || newId()),
          owner: r.owner || currentUser(),
          ts: +r.ts,
          note: r.note || ''
        };
        if (kindOf(r) === 'weight') {
          return Object.assign(base, { kind: 'weight', kg: +r.kg, fast: r.fast === 'full' ? 'full' : 'fasting' });
        }
        return Object.assign(base, { kind: 'bp', sys: +r.sys, dia: +r.dia, hr: r.hr ? +r.hr : null, med: r.med === 'after' ? 'after' : 'before' });
      }));
      setRecords(merged);
      const existingInj = new Set(getInj().map(r => r.id));
      setInj(getInj().concat(validInj.map(r => ({
        id: existingInj.has(r.id) ? r.id + '_imp' : (r.id || newId()),
        owner: r.owner || currentUser(),
        ts: +r.ts,
        conc: String(r.conc || '5'),
        pen: +r.pen || 1,
        shot: +r.shot || 1
      }))));
      if (validDaily.length) {
        const map = new Map(getDaily().map(r => [r.day, r]));
        validDaily.forEach(r => {
          map.set(+r.day, {
            id: map.get(+r.day)?.id || newId(),
            owner: r.owner || currentUser(),
            day: +r.day,
            breakfast: r.breakfast || '', lunch: r.lunch || '', dinner: r.dinner || '', snack: r.snack || '',
            poop: !!r.poop, period: !!r.period,
            waterMl: +r.waterMl || 0, sleepH: +r.sleepH || 0,
            sport: r.sport || '', drinks: r.drinks || ''
          });
        });
        setDaily(Array.from(map.values()));
      }
      renderRecent();
      toast(`已导入 ${valid.length} 条记录${validInj.length ? `、${validInj.length} 条打针` : ''}${validDaily.length ? `、${validDaily.length} 条日常` : ''} ✓`, 3000);
    } catch {
      toast('文件格式不正确', 3000);
    }
  };
  rd.readAsText(file);
}

/* ================= 事件绑定 & 初始化 ================= */
function bindEvents() {
  $('#loginBtn').onclick = doLogin;
  $('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  $('#medSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    curMed = b.dataset.med;
    $$('#medSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#kindSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    curKind = b.dataset.kind;
    applyKind();
    renderRecent();
  });
  $('#fastSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    curFast = b.dataset.fast;
    $$('#fastSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#unitToggle').addEventListener('click', () => setUnit(curUnit === 'kg' ? 'jin' : 'kg', true));
  $('#inWeight').addEventListener('input', updateWeightHint);
  // 录入页：展开/收起"同时记录打针"
  $('#injToggle').addEventListener('click', () => {
    const open = injFormOpen();
    $('#injForm').style.display = open ? 'none' : 'flex';
    $('#injArrow').textContent = open ? '展开 ›' : '收起 ⌄';
    if (!open && !$('#injTime').value) {
      const n = new Date();
      $('#injTime').value = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
    }
  });
  // 两个浓度分段（录入页 + 弹层）共用一套交互
  $$('.injConcSeg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  }));
  // 打针弹层按钮
  $('#sInjSave').onclick = saveInjSheet;
  $('#sInjCancel').onclick = closeInjSheet;
  $('#sInjDelete').onclick = deleteInjSheet;
  $('#injSheetMask').onclick = closeInjSheet;
  // 打针视图：点行删除该针
  $('#wInjWrap').addEventListener('click', e => {
    const row = e.target.closest('.wrow[data-id]'); if (!row) return;
    if (confirm('删除这条打针记录？')) { delInj(row.dataset.id); renderHistory(); }
  });
  // 日常表单：大便/月经开关（可多选）
  $('#dFlagSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    dFlags[b.dataset.f] = !dFlags[b.dataset.f];
    renderDFlags();
  });
  // 日常表单：喝水/睡眠步进
  $('#dWaterMinus').addEventListener('click', () => { dWater = Math.max(0, dWater - 250); renderSteppers(); });
  $('#dWaterPlus').addEventListener('click', () => { dWater += 250; renderSteppers(); });
  $('#dSleepMinus').addEventListener('click', () => { dSleep = Math.max(0, Math.round((dSleep - 0.5) * 10) / 10); renderSteppers(); });
  $('#dSleepPlus').addEventListener('click', () => { dSleep = Math.round((dSleep + 0.5) * 10) / 10; renderSteppers(); });
  // 日常表单：换日期时带出那天已有记录
  $('#dDate').addEventListener('change', () => {
    const v = $('#dDate').value; if (!v) return;
    const [y, m, dd] = v.split('-').map(Number);
    prefillDailyForm(y * 10000 + m * 100 + dd);
  });
  // 日常历史：点卡片编辑，点 ✕ 删除
  $('#dListWrap').addEventListener('click', e => {
    const del = e.target.closest('.del');
    if (del) {
      e.stopPropagation();
      if (confirm('删除这天的日常记录？')) { delDaily(del.dataset.id); renderHistory(); }
      return;
    }
    const card = e.target.closest('.day-card');
    if (card) editDaily(+card.dataset.day);
  });
  ['#inSys', '#inDia'].forEach(s => $(s).addEventListener('input', markBadInputs));
  $('#saveBtn').onclick = saveRecord;

  $('#camBtn').onclick = () => $('#camInput').click();
  $('#camInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) recognizePhoto(f);
    e.target.value = '';
  });

  $('#histSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histFilter = b.dataset.f;
    $$('#histSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderHistory();
  });
  $('#histSegW').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histFilter = b.dataset.f;
    $$('#histSegW button').forEach(x => x.classList.toggle('on', x === b));
    renderHistory();
  });
  $('#histKindSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histKind = b.dataset.kind;
    $$('#histKindSeg button').forEach(x => x.classList.toggle('on', x === b));
    histFilter = 'all';
    $$('#histSeg button').forEach(x => x.classList.toggle('on', x.dataset.f === 'all'));
    renderHistory();
  });
  $('#histViewSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histView = b.dataset.v;
    $$('#histViewSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderHistory();
  });
  // 记录页单位切换（只影响记录页展示）
  $('#histUnitSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histUnit = b.dataset.u;
    $$('#histUnitSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderHistory();
  });
  // 阶段目标编辑器：添加 / 删除
  $('#stageAddBtn').addEventListener('click', () => {
    readStageInputs();
    stageDraft.push('');
    renderStageEditor();
  });
  $('#stageList').addEventListener('click', e => {
    const b = e.target.closest('.del'); if (!b) return;
    readStageInputs();
    stageDraft.splice(+b.dataset.i, 1);
    renderStageEditor();
  });
  // 体重行式列表：点击某个体重数字可删除该条记录
  $('#wListWrap').addEventListener('click', e => {
    const cellEl = e.target.closest('[data-id]'); if (!cellEl) return;
    if (confirm('删除这条记录？')) { delRecord(cellEl.dataset.id); renderHistory(); renderRecent(); }
  });
  $('#histList').addEventListener('click', e => {
    const btn = e.target.closest('.del'); if (!btn) return;
    const id = btn.closest('.rec').dataset.id;
    if (confirm('删除这条记录？')) { delRecord(id); renderHistory(); renderRecent(); }
  });
  $('#recentList').addEventListener('click', e => {
    const btn = e.target.closest('.del'); if (!btn) return;
    const id = btn.closest('.rec').dataset.id;
    if (confirm('删除这条记录？')) { delRecord(id); renderRecent(); }
  });

  $('#chartSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    chartFilter = b.dataset.f;
    $$('#chartSeg button').forEach(x => x.classList.toggle('on', x === b));
    drawChart();
  });
  $('#chartSegW').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    chartFilter = b.dataset.f;
    $$('#chartSegW button').forEach(x => x.classList.toggle('on', x === b));
    drawChart();
  });
  $('#chartKindSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    chartKind = b.dataset.kind;
    applyChartKind();
    chartFilter = 'all';
    $$('#chartSeg button, #chartSegW button').forEach(x => x.classList.toggle('on', x.dataset.f === 'all'));
    drawChart();
  });
  $('#rangeRow').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    chartDays = +b.dataset.d;
    $$('#rangeRow button').forEach(x => x.classList.toggle('on', x === b));
    drawChart();
  });
  window.addEventListener('resize', () => { if (curPage === 'chart') drawChart(); });

  $('#saveApiBtn').onclick = saveSettings;
  $('#testApiBtn').onclick = testApi;
  $('#saveBodyBtn').onclick = saveBody;
  $('#unitSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#unitSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#exportCsvBtn').onclick = exportCsv;
  $('#exportJsonBtn').onclick = exportJson;
  $('#importJsonBtn').onclick = () => $('#importInput').click();
  $('#importInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importJson(f);
    e.target.value = '';
  });
  $('#logoutBtn').onclick = logout;
}

(function init() {
  buildNav();
  bindEvents();
  const acc = LS.get(K_ACCOUNT, null);
  if (!acc) $('#loginSub').textContent = '首次使用，输入账号密码即完成注册';
  const saved = LS.get(K_REMEMBER, null);
  if (saved) { $('#loginUser').value = saved.u; $('#loginPass').value = saved.p; }
  if (currentUser()) enterApp();
  else tryAutoLogin();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
